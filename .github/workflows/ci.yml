name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest --cov=credit_risk --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t credit-risk:ci .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 credit-risk:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && break
            sleep 2
          done
          curl -fs http://localhost:8000/health | grep '"status":"ok"'
          curl -fs http://localhost:8000/model-info > /dev/null
          curl -fs http://localhost:8000/ | grep -q "Credit default risk"
